t-size:11px;border:1px solid #536d8d;color:#b4cff8;border-radius:30px;padding:7px 11px;display:inline-flex;white-space:nowrap}.feature{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#141d2c;border:1px solid #ffffff1a;border-radius:18px;padding:25px 30px;margin:6px 0 85px}.feature h3{margin:0 0 5px}.feature p{margin:0;font-size:13px}.page-title{padding:67px 0 35px}.page-title h1{font-size:45px;margin:15px 0;letter-spacing:-.05em}.controls{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:26px}.field,.select,.area{width:100%;background:#171e2a;border:1px solid #394455;color:#e9f0ff;border-radius:9px;outline:none;padding:13px 14px}.field:focus,.select:focus,.area:focus{border-color:#97b8fa}.search{max-width:360px}.filter{display:flex;gap:8px;flex-wrap:wrap}.filter button{background:#171d29;color:#a6b4ca;border:1px solid #29364a;padding:11px 15px;border-radius:8px;font-size:12px}.filter button.selected{color:#102037;background:#aec9ff;border-color:#aec9ff}.detail{padding:68px 0;display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:65px}.detail h1{font-size:clamp(36px,5vw,64px);letter-spacing:-.05em;margin:12px 0}.detailcopy{padding-top:20px}.detail .cover{box-shadow:0 20px 70px #0008}.player{background:#151d2a;border:1px solid #31415d;border-radius:12px;padding:18px;margin:25px 0}.playerrow{display:flex;align-items:center;gap:12px}.roundplay{height:46px;width:46px;border-radius:50%;background:#a9c7ff;color:#111927;border:0;font-weight:900;font-size:18px}.player small{color:#a8b6cc}audio{width:100%;margin-top:13px}.conditions{padding:20px;border:1px solid #34405a;border-radius:12px;margin:28px 0}.conditions p{margin:7px 0;font-size:13px;color:#b9c6da}.formcard{max-width:620px;background:#131b27;border:1px solid #303c50;border-radius:15px;padding:27px;margin:30px auto 80px}.label{display:block;font-size:12px;color:#cad5e6;font-weight:700;margin:17px 0 8px}.area{resize:vertical;min-height:100px}.notice{font-size:12px;color:#a9b6c8;line-height:1.7}.notice strong{color:#e5eefa}.checkrow{display:flex;align-items:flex-start;gap:10px;margin:18px 0;color:#ccd5e3;font-size:12px}.checkrow input{accent-color:#aac6ff;margin-top:2px}.admin-layout{display:grid;grid-template-columns:210px 1fr;gap:30px;padding:55px 0}.sidebar{border:1px solid #ffffff17;border-radius:12px;padding:16px;align-self:start;background:#111824}.sidebar button{display:block;width:100%;text-align:left;border:none;background:none;color:#aab8cf;padding:13px 12px;border-radius:8px;font-weight:700}.sidebar button.current{background:#26344a;color:white}.panel{background:#111824;border:1px solid #ffffff18;border-radius:14px;padding:24px;margin-top:20px}.panel h2{margin:0 0 20px;font-size:22px}.admin-table{width:100%;border-collapse:collapse}.admin-table td,.admin-table th{border-bottom:1px solid #ffffff16;text-align:left;padding:15px 8px;font-size:12px}.admin-table th{color:#8c9ab2}.admin-table td{color:#dae5f5}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.noticebox{background:#1e2b3d;border:1px solid #425675;padding:16px;border-radius:10px;font-size:12px;line-height:1.8;color:#c6d9f7}.footer{border-top:1px solid #ffffff14;padding:30px 0 45px;color:#8491a8;font-size:11px;display:flex;justify-content:space-between;gap:20px}.empty{color:#a9b5c7;background:#151c27;border-radius:12px;padding:40px;text-align:center}.toast{position:fixed;right:24px;bottom:24px;background:#a9c7ff;color:#182235;padding:13px 19px;border-radius:9px;font-weight:700;box-shadow:0 15px 45px #0008;z-index:30;font-size:13px}.badge{background:#293a54;color:#bcd4fc;border-radius:5px;padding:5px 7px;font-size:10px}.badge.pending{background:#55432d;color:#f2d4a1}.footnote{color:#79889d;font-size:11px;line-height:1.7}.about{max-width:750px;padding:80px 0}.about h1{font-size:55px;letter-spacing:-.05em}.mobile-menu{display:none}@media(max-width:800px){.nav{height:68px;padding:0 18px;gap:10px}.brand{font-size:17px}.navlinks{gap:11px}.navlinks button{font-size:10px;letter-spacing:0}.adminlink{padding:8px!important}.container{padding:0 20px}.hero{grid-template-columns:1fr;padding:57px 0;gap:45px}.hero-art{width:min(70%,350px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.detail{grid-template-columns:1fr;gap:15px;padding:30px 0}.detail>.cover{width:min(100%,420px);margin:auto}.feature{flex-direction:column;align-items:start}.admin-layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;gap:5px}.sidebar button{white-space:nowrap}.cols{grid-template-columns:1fr}.admin-table{display:block;overflow-x:auto}.footer{flex-direction:column}.page-title h1{font-size:38px}}@media(max-width:380px){.brand{font-size:14px}.navlinks{gap:7px}.navlinks button{font-size:9px}.hero h1{font-size:44px}}

.uploaded-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}.cover:has(.uploaded-cover):before,.cover:has(.uploaded-cover):after{display:none}.cover:has(.uploaded-cover) .art-top,.cover:has(.uploaded-cover) .art-title,.cover:has(.uploaded-cover) .art-bottom{display:none}.email-address{padding:20px;border:1px solid #4a5870;background:#1c2636;border-radius:12px;font-size:clamp(16px,4vw,23px);overflow-wrap:anywhere;user-select:all}.upload-preview{display:block;width:170px;max-width:100%;aspect-ratio:16/9;object-fit:cover;margin:12px 0;border-radius:8px;border:1px solid #3b4a61}</style>

<body>
<div id="app"><div style="padding:40px 24px;color:#f8f8f8;font-family:sans-serif;background:#0a0d14;min-height:100vh"><h1>MEMENTO.</h1><p>음악 스토어 화면을 불러오는 중…</p></div></div>
<noscript>이 시제품은 JavaScript가 활성화되어야 표시돼.</noscript>
<script>
/* MEMENTO interactive prototype. No backend or authentication is connected. */
const initial=[
{id:'beyond',title:'Beyond the Blue',artist:'MEMENTO',genre:'Cinematic',format:'MP3 · WAV',description:'푸른 지평선 너머의 이야기를 담은 시네마틱 사운드. 넓은 공간감과 서서히 고조되는 멜로디.',condition:'무료 신청 · 채널 응원은 자율',youtube:'',variant:0,public:true,featured:true},
{id:'fragments',title:'Fragments',artist:'MEMENTO',genre:'Piano',format:'MP3 · WAV',description:'기억의 작은 파편처럼 잔잔하게 이어지는 피아노.',condition:'무료 신청 · 채널 응원은 자율',variant:1,public:true,featured:true},
{id:'afterglow',title:'Afterglow',artist:'MEMENTO',genre:'Ambient',format:'MP3',description:'한 장면의 잔광을 느리게 따라가는 앰비언트 사운드.',condition:'무료 신청 · 채널 응원은 자율',variant:2,public:true,featured:false},
{id:'first-light',title:'First Light',artist:'MEMENTO',genre:'Cinematic',format:'MP3 · WAV',description:'새로운 하루의 시작을 담은 따뜻한 오케스트라 스케치.',condition:'무료 신청 · 채널 응원은 자율',variant:3,public:true,featured:false}
];
const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
let products=read('memento-products-v2',initial.map(p=>({...p,youtube:''})));let settings=read('memento-settings-v2',{email:'',brand:'An M UNIVERSE Brand'});
let state={page:'home',id:null,filter:'ALL',q:'',adminTab:'products',editing:null};
const app=document.querySelector('#app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{localStorage.setItem('memento-products-v2',JSON.stringify(products));localStorage.setItem('memento-settings-v2',JSON.stringify(settings))};
const byId=id=>products.find(p=>p.id===id);
const visible=()=>products.filter(p=>p.public);
const cover=(p,cls='')=>`<div class="cover variant-${Number(p.variant)%5} ${cls}" role="img" aria-label="${esc(p.title)} 커버 아트">${p.coverImage?`<img class="uploaded-cover" src="${esc(p.coverImage)}" alt="${esc(p.title)} 커버 이미지"/>`:``}<span class="art-top">MEMENTO / DIGITAL SERIES</span><span class="art-title">${esc(p.title)}</span><span class="art-bottom">SOUND WORTH KEEPING</span></div>`;
const button=(text,fn,cl='btn')=>`<button class="${cl}" onclick="${fn}">${text}</button>`;
function nav(){return `<header class="topbar"><div class="nav"><a class="brand" href="#home">MEMEN<span>TO.</span></a><nav class="navlinks"><button onclick="go('home')" class="${state.page==='home'?'active':''}">HOME</button><button onclick="go('store')" class="${state.page==='store'||state.page==='detail'?'active':''}">STORE</button><button onclick="go('about')" class="${state.page==='about'?'active':''}">ABOUT</button></nav></div></header>`}
function footer(){return `<footer class="container footer"><div>MEMENTO © 2026 · SOUND WORTH KEEPING</div><div>${esc(settings.brand)}</div></footer>`}
function card(p){return `<article class="product" tabindex="0" onkeydown="if(event.key==='Enter')detail('${esc(p.id)}')" onclick="detail('${esc(p.id)}')">${cover(p)}<div class="pinfo"><div class="tag">${esc(p.genre)}</div><h3>${esc(p.title)}</h3><div class="meta">${esc(p.format)} · 무료 디지털 굿즈</div></div></article>`}
function home(){let list=visible();return `<main class="container"><section class="hero"><div><div class="eyebrow">A DIGITAL MUSIC COLLECTION</div><h1>Keep the<br/><em>sound.</em><br/>Keep the moment.</h1><p class="muted">한 순간의 감정을 오래 간직하는 방법. MEMENTO에서 음악을 발견하고 디지털 굿즈를 무료로 신청하실 수 있습니다.</p><div class="actions">${button('컬렉션 둘러보기 →',"go('store')")}${button('MEMENTO 소개',"go('about')",'btn secondary')}</div></div>${cover(list[0]||initial[0],'hero-art')}</section><section class="section"><div class="sectionhead"><div><div class="eyebrow">THE COLLECTION</div><h2>Featured sounds</h2></div><button class="textlink" onclick="go('store')">전체 굿즈 보기 →</button></div><div class="grid">${list.filter(x=>x.featured).concat(list.filter(x=>!x.featured)).slice(0,4).map(card).join('')||'<p class="muted">아직 공개된 음악이 없어.</p>'}</div></section><div class="feature"><div><h3>Music is meant to be shared.</h3><p class="muted">별도의 결제 없이 무료로 신청하실 수 있습니다. 좋아요와 구독은 자율적인 응원입니다.</p></div>${button('굿즈 찾아보기 →',"go('store')",'btn secondary')}</div></main>`}
function store(){const list=visible().filter(p=>(state.filter==='ALL'||p.genre===state.filter)&&(`${p.title} ${p.genre} ${p.description}`.toLowerCase().includes(state.q.toLowerCase())));const genres=['ALL',...new Set(visible().map(p=>p.genre))];return `<main class="container"><div class="page-title"><div class="eyebrow">MEMENTO / THE STORE</div><h1>Sound Collection</h1><p class="muted">다양한 사운드를 만나보고 디지털 굿즈를 신청해 보세요.</p></div><div class="controls"><input class="field search" placeholder="음악·장르 검색" aria-label="음악 검색" value="${esc(state.q)}" oninput="search(this.value)"/><div class="filter">${genres.map(g=>`<button class="${g===state.filter?'selected':''}" onclick="setFilter('${esc(g)}')">${esc(g)}</button>`).join('')}</div></div><section class="section" style="padding-top:5px"><div class="grid">${list.map(card).join('')}</div>${!list.length?'<div class="empty">검색 결과가 없습니다. 다른 검색어로 다시 검색해 주세요.</div>':''}</section></main>`}
function detailPage(){let p=byId(state.id);if(!p||!p.public)return store();return `<main class="container"><div class="detail">${cover(p)}<div class="detailcopy"><div class="eyebrow">${esc(p.genre)} / DIGITAL GOODS</div><h1>${esc(p.title)}</h1><p class="muted">${esc(p.artist)} · ${esc(p.format)}</p><p class="muted">${esc(p.description)}</p><div class="player"><strong>Listen on YouTube</strong><p class="muted">${p.youtube?`<a class="btn secondary" href="${esc(safeYoutube(p.youtube))}" target="_blank" rel="noopener noreferrer">▶ 유튜브에서 감상하기 ↗</a>`:'유튜브 영상이 아직 등록되지 않았습니다.'}</p></div><div class="conditions"><strong>FREE DIGITAL DOWNLOAD REQUEST</strong><p>본 굿즈는 무료로 신청하실 수 있습니다. 유튜브 구독과 좋아요는 선택 사항입니다.</p><span class="pill">${esc(p.condition)}</span></div>${button('신청 안내 확인 →',`apply('${esc(p.id)}')`)} ${button('← 스토어',"go('store')",'btn secondary')}</div></div></main>`}
function formPage(){let p=byId(state.id);if(!p)return store();return `<main class="container"><div class="page-title"><div class="eyebrow">CONTACT / MEMENTO</div><h1>굿즈 신청 안내</h1><p class="muted">${esc(p.title)}</p></div><div class="formcard"><h2>이메일로 신청해 주세요.</h2><p class="muted">아래 이메일 주소로 원하시는 굿즈의 이름과 파일 형식을 작성하여 보내주시기 바랍니다. 확인 후 이메일로 안내해 드리겠습니다.</p>${settings.email?`<div class="email-address">${esc(settings.email)}</div>`:'<div class="noticebox">운영자 이메일 주소가 아직 등록되지 않았습니다.</div>'}<p class="footnote">신청하실 굿즈: ${esc(p.title)}</p></div></main>`}
function safeYoutube(s){try{const u=new URL(s);return u.protocol==='https:'&&['youtube.com','www.youtube.com','youtu.be','m.youtube.com','music.youtube.com'].includes(u.hostname)?u.href:''}catch{return ''}}
function mailLink(p){return 'mailto:'+settings.email+'?subject='+encodeURIComponent('[MEMENTO 굿즈 신청] '+p.title)+'&body='+encodeURIComponent('신청 굿즈: '+p.title+'\n희망 파일 형식: \n문의 사항: \n')}
function saveSettings(e){e.preventDefault();const f=new FormData(e.target);settings.email=String(f.get('email')||'').trim();settings.brand=String(f.get('brand')||'An M UNIVERSE Brand').trim();save();admin('settings');toast('이 기기에 설정을 저장했어.')}
function exportData(){const b=new Blob([JSON.stringify({products,settings},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='memento-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){const f=e.target.files?.[0];if(!f)return;f.text().then(t=>{try{const v=JSON.parse(t);if(!Array.isArray(v.products)||!v.settings)throw Error();if(!confirm('현재 기기의 상품과 설정을 교체할까?'))return;products=v.products;settings=v.settings;save();admin('products');toast('백업을 불러왔어.')}catch{alert('올바른 백업 파일이 아니야.')}})}
function about(){return `<main class="container"><div class="about"><div class="eyebrow">ABOUT THE ARCHIVE</div><h1>Every sound,<br/>a memory.</h1><p class="muted">MEMENTO는 음악과 순간의 기억을 담아내는 디지털 컬렉션입니다. 다양한 음악과 디지털 굿즈를 만나보세요.</p><div class="conditions"><strong>HOW IT WORKS</strong><p>① 스토어에서 원하시는 굿즈를 선택해 주세요.</p><p>② 유튜브 영상과 상세 정보를 확인해 주세요.</p><p>③ 안내된 이메일 주소로 굿즈를 신청해 주세요.</p><p>④ 담당자가 확인 후 이메일로 안내해 드립니다.</p></div>${button('음악 둘러보기 →',"go('store')")}</div></main>`}
const adminSidebar=()=>`<aside class="sidebar"><button class="${state.adminTab==='products'?'current':''}" onclick="admin('products')">◈ 굿즈 관리</button><button class="${state.adminTab==='edit'?'current':''}" onclick="newProduct()">＋ 굿즈 등록</button><button class="${state.adminTab==='requests'?'current':''}" onclick="admin('requests')">☷ 신청 안내</button><button class="${state.adminTab==='settings'?'current':''}" onclick="admin('settings')">⚙ 사이트 설정</button></aside>`;
function adminPage(){let body='';if(state.adminTab==='products'){body=`<div class="sectionhead"><div><div class="eyebrow">PRODUCT MANAGER</div><h2>굿즈 관리</h2></div>${button('+ 새 굿즈', 'newProduct()', 'btn small')}</div><div class="panel"><table class="admin-table"><thead><tr><th>상품명</th><th>장르</th><th>상태</th><th>작업</th></tr></thead><tbody>${products.map(p=>`<tr><td><strong>${esc(p.title)}</strong></td><td>${esc(p.genre)}</td><td><span class="badge ${p.public?'':'pending'}">${p.public?'공개':'비공개'}</span></td><td><button class="btn secondary small" onclick="editProduct('${esc(p.id)}')">수정</button></td></tr>`).join('')}</tbody></table></div>`}else if(state.adminTab==='edit'){let p=byId(state.editing)||{title:'',artist:'MEMENTO',genre:'Cinematic',format:'MP3 · WAV',description:'',condition:'무료 신청 · 채널 응원은 자율',youtube:'',variant:0,public:false,featured:false};body=`<div class="eyebrow">PRODUCT EDITOR</div><h2>${state.editing?'굿즈 정보 수정':'새 굿즈 등록'}</h2><form class="panel" onsubmit="saveProduct(event)"><div class="cols"><div><label class="label">상품명 *</label><input class="field" name="title" value="${esc(p.title)}" required maxlength="100"/></div><div><label class="label">아티스트</label><input class="field" name="artist" value="${esc(p.artist)}" maxlength="100"/></div><div><label class="label">장르</label><input class="field" name="genre" value="${esc(p.genre)}" maxlength="50" required/></div><div><label class="label">제공 파일 형식</label><input class="field" name="format" value="${esc(p.format)}" maxlength="80"/></div><div><label class="label">굿즈 썸네일 이미지 업로드</label><p class="footnote">유튜브 썸네일처럼 직접 이미지를 등록하실 수 있습니다. 권장 비율 16:9 또는 정사각형 · JPG/PNG/WebP · 5MB 이하. 이 시제품에서는 현재 기기에만 저장됩니다.</p><input class="field" name="coverUpload" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewCoverUpload(this)"/><img id="coverUploadPreview" class="upload-preview" style="${p.coverImage?'':'display:none'}" src="${esc(p.coverImage||'')}" alt="업로드 이미지 미리보기"/><label class="checkrow"><input type="checkbox" name="removeCover"/>기존 썸네일 제거</label><label class="label">커버 색상 테마</label><select class="select" name="variant">${[0,1,2,3,4].map(x=>`<option ${Number(p.variant)===x?'selected':''} value="${x}">테마 ${x+1}</option>`).join('')}</select></div><div><label class="label">제공 조건 안내</label><input class="field" name="condition" value="${esc(p.condition)}" maxlength="100"/></div></div><label class="label">유튜브 링크</label><input class="field" name="youtube" type="url" value="${esc(p.youtube||'')}" placeholder="https://www.youtube.com/watch?v=..."/><label class="label">굿즈 설명</label><textarea class="area" name="description" maxlength="1200">${esc(p.description)}</textarea><label class="checkrow"><input type="checkbox" name="public" ${p.public?'checked':''}/>스토어에 공개</label><label class="checkrow"><input type="checkbox" name="featured" ${p.featured?'checked':''}/>홈페이지 추천 상품</label><div class="actions"><button class="btn" type="submit">변경사항 저장</button>${button('취소',"admin('products')",'btn secondary')}${state.editing?button('삭제',`deleteProduct('${esc(state.editing)}')`,'btn secondary'):''}</div><p class="footnote">업로드한 썸네일은 현재 브라우저에만 저장됩니다. 실제 사이트 전체에 반영하려면 향후 CMS와 이미지 저장소를 연결해야 합니다.</p></form>` }else if(state.adminTab==='settings'){body=`<div class="eyebrow">SITE SETTINGS</div><h2>사이트 설정</h2><form class="panel" onsubmit="saveSettings(event)"><label class="label">신청을 받을 이메일</label><input class="field" type="email" name="email" value="${esc(settings.email)}" placeholder="hello@example.com"/><label class="label">소속 브랜드 표기</label><input class="field" name="brand" value="${esc(settings.brand)}"/><button class="btn" type="submit">설정 저장</button></form><div class="panel"><h3>백업 관리</h3><p class="muted">이 시제품의 수정 내용은 현재 기기에만 저장돼. 다른 방문자에게는 반영되지 않아.</p><div class="actions"><button class="btn secondary" onclick="exportData()">JSON 백업 다운로드</button><label class="btn secondary" style="cursor:pointer">백업 불러오기<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"/></label></div></div>`}else{body=`<div class="eyebrow">EMAIL REQUESTS</div><h2>신청 관리 안내</h2><div class="panel"><p class="muted">신청 메일은 사이트가 아닌 운영자 이메일 받은편지함에서 확인해. 이 사이트에는 고객 이메일이 저장되지 않아.</p></div>`}return `<main class="container"><div class="page-title"><div class="eyebrow">MANAGEMENT SPACE</div><h1>MEMENTO Admin</h1><div class="noticebox"><strong>체험용 관리자 화면</strong> · 로그인/접근 권한이 적용되지 않았어. 실제 운영 전에는 서버 인증과 데이터베이스 연결이 필수야. 상품과 설정은 이 브라우저에만 저장돼. 다른 방문자에게 적용하려면 추후 Git 기반 CMS 연결이 필요해.</div></div><div class="admin-layout">${adminSidebar()}<section>${body}</section></div></main>`}
function render(){app.innerHTML=`<div class="shell">${nav()}${state.page==='home'?home():state.page==='store'?store():state.page==='detail'?detailPage():state.page==='form'?formPage():state.page==='about'?about():adminPage()}${footer()}</div>`}
function go(page){state.page=page;if(page==='store')state.filter='ALL';render();window.scrollTo(0,0)}
function detail(id){state.id=id;go('detail')}function apply(id){state.id=id;go('form')}function admin(tab){state.page='admin';state.adminTab=tab;render();window.scrollTo(0,0)}
function setFilter(g){state.filter=g;render()}function search(q){state.q=q;const pos=document.activeElement?.selectionStart;render();const inp=document.querySelector('.search');inp?.focus();if(pos!=null)inp?.setSelectionRange(pos,pos)}
function newProduct(){state.editing=null;admin('edit')}function editProduct(id){state.editing=id;admin('edit')}
async function previewCoverUpload(el){const f=el.files?.[0];if(!f)return;const img=document.getElementById('coverUploadPreview');img.src=URL.createObjectURL(f);img.style.display='block'}
async function resizeCover(file){if(file.size>5*1024*1024)throw Error('5MB 이하의 이미지를 선택해 주세요.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG, PNG 또는 WebP 이미지만 사용할 수 있습니다.');const bitmap=await createImageBitmap(file);const scale=Math.min(1,900/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();return canvas.toDataURL('image/jpeg',0.76)}
async function saveProduct(e){e.preventDefault();const f=new FormData(e.target),name=String(f.get('title')).trim();if(!name)return;const previous=byId(state.editing);let coverImage=previous?.coverImage||'';const upload=f.get('coverUpload');if(f.has('removeCover'))coverImage='';if(upload&&upload.size){try{coverImage=await resizeCover(upload)}catch(err){alert(err.message);return}}const obj={coverImage,id:previous?.id||`item-${Date.now()}`,title:name,artist:String(f.get('artist')||'MEMENTO').trim(),genre:String(f.get('genre')||'Other').trim(),format:String(f.get('format')||'Digital').trim(),description:String(f.get('description')||'').trim(),condition:String(f.get('condition')||'무료 신청').trim(),youtube:safeYoutube(String(f.get('youtube')||'')),variant:Number(f.get('variant')),public:f.has('public'),featured:f.has('featured')};if(previous)products=products.map(p=>p.id===obj.id?obj:p);else products.unshift(obj);try{save()}catch(err){alert('브라우저 저장 공간이 부족합니다. 작은 이미지를 사용해 주세요.');return}admin('products');toast('굿즈 정보가 이 브라우저에 저장됐습니다.')}
function deleteProduct(id){if(!confirm('이 굿즈를 목록에서 삭제할까?'))return;products=products.filter(p=>p.id!==id);save();admin('products');toast('삭제했어.')}
function previewNotice(){toast('오디오 파일 연결은 다음 단계에서 구현할 거야.')}function toast(t){document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),3500)}
const route=()=>{const h=location.hash.replace('#','');if(h==='store'||h==='about'||h==='admin')state.page=h};window.addEventListener('hashchange',route);route();render();
async function loadProducts() {
  try {
    const response = await fetch('./products.json', { cache: 'no-store' });
    if (!response.ok) throw new Error('상품 데이터를 불러올 수 없어');
    const data = await response.json();
    if (!Array.isArray(data.products)) throw new Error('상품 데이터 형식 오류');

    if (data.products.length > 0) {
      products = data.products;
      render();
    }
  } catch (error) {
    console.error('MEMENTO 상품 불러오기 실패:', error);
  }
}

async function loadSiteSettings() {
  try {
    const response = await fetch('./settings.json', {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('사이트 설정을 불러오지 못했어.');
    }

    const onlineSettings = await response.json();

    if (
      typeof onlineSettings.email !== 'string' ||
      typeof onlineSettings.brand !== 'string'
    ) {
      throw new Error('사이트 설정 형식이 올바르지 않아.');
    }

    settings = {
      email: onlineSettings.email,
      brand: onlineSettings.brand
    };

    render();
  } catch (error) {
    console.error('MEMENTO 사이트 설정 불러오기 실패:', error);
  }
}

  loadProducts();
  loadSiteSettings();
</script>
</body>
</html>
